name: Auto Sync Ito-san Portal (chatgpt.site -> GitHub -> Cloudflare Pages)

# 2026-10-28 Claude Code 改修
# - 書き手はこのワークフローだけ（M5Pro launchd 15分は停止・退避済み）。手元PCから同期 push しない。
# - 取り込みは .github/scripts/sync_ito_portal.py に一本化（ロジックの二重持ちをやめる）。
#   取得・検証に1つでも失敗したら何も書かずに失敗 → Issue で通知。
# - push 後、本番 URL の index.html が今回 commit と一致するまで確認する（「push した＝反映した」とみなさない）。
# - 頻度：伊藤さんのご要望「1日2回程度」に対し、日中 2 時間おき（JST 8〜22時・1日8回）。手動実行も可。

on:
  schedule:
    # UTC 表記。JST 8,10,12,14,16,18,20,22 時
    - cron: '0 23,1,3,5,7,9,11,13 * * *'
  workflow_dispatch:
    inputs:
      selftest_failure:
        description: '通知経路の点検用：何も取り込まずにわざと失敗させ、Issue が立つことを確認する'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: auto-sync-ito
  cancel-in-progress: false

env:
  PROD_URL: https://golfans-members-connect.pages.dev

jobs:
  sync:
    # osaken55 側のミラーでは走らせない（2 つの repo が別々に commit して分岐するのを防ぐ）
    if: github.repository == 'osAKen-ai/golfans_members-connect'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Self-test of the failure alert path
        id: selftest
        if: inputs.selftest_failure
        run: |
          echo "selftest_failure=true: 意図的に失敗させて通知経路を点検します"
          exit 1

      - name: Fetch, validate and apply Ito-san portal
        id: fetch_sync
        run: python3 .github/scripts/sync_ito_portal.py --list "$RUNNER_TEMP/changed.txt"

      - name: Commit and push (named files only)
        id: push
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/changed.txt" ]; then
            echo "No changes detected."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "Kenichiro Osada"
          git config user.email "50192666+osaken55@users.noreply.github.com"
          xargs -d '\n' git add -- < "$RUNNER_TEMP/changed.txt"
          git commit -m "feat(auto-sync): sync Ito-san portal ($(wc -l < "$RUNNER_TEMP/changed.txt") files)" \
                     -m "$(cat "$RUNNER_TEMP/changed.txt")"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            [ "$i" = 3 ] && { echo "push failed 3 times"; exit 1; }
            sleep 10
          done
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify production reflects HEAD (hash match on every run)
        id: verify_prod
        run: |
          set -euo pipefail
          # 差分有無に関わらず毎回 HEAD の配信対象ファイルと本番 URL の sha256 一致を検証する
          # （前回 push 後に配信確認で失敗したまま次回「差分なし」で復旧 close されるのを防ぐ）
          prod_path() { case "$1" in index.html) echo "/";; *.html) echo "/${1%.html}";; *) echo "/$1";; esac; }
          git ls-files -- '*.html' '*.js' '*.css' 'assets/*' ':!functions/*' ':!.github/*' > "$RUNNER_TEMP/verify_targets.txt"
          if [ -s "$RUNNER_TEMP/changed.txt" ]; then
            cat "$RUNNER_TEMP/changed.txt" "$RUNNER_TEMP/verify_targets.txt" | sort -u > "$RUNNER_TEMP/all_targets.txt"
          else
            cp "$RUNNER_TEMP/verify_targets.txt" "$RUNNER_TEMP/all_targets.txt"
          fi
          max_tries=6
          [ "${{ steps.push.outputs.pushed }}" = "true" ] && max_tries=30
          for i in $(seq 1 "$max_tries"); do
            pending=0
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              want=$(git show "HEAD:$f" | sha256sum | cut -d' ' -f1)
              got=$(curl -fsSL "$PROD_URL$(prod_path "$f")?nocache=$(date +%s)" | sha256sum | cut -d' ' -f1 || true)
              [ "$got" = "$want" ] || { pending=1; echo "waiting ($i/$max_tries): $f (want=$want got=$got)"; }
            done < "$RUNNER_TEMP/all_targets.txt"
            if [ "$pending" = 0 ]; then
              echo "✅ 本番反映確認: 全 $(wc -l < "$RUNNER_TEMP/all_targets.txt") ファイルの sha256 が HEAD (${{ steps.push.outputs.sha }}) と一致" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "Production did not match HEAD (${{ steps.push.outputs.sha }}) within timeout"
          exit 1

      - name: Notify failure via Issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${{ steps.selftest.outcome }}" = "failure" ]; then
            stage_msg="通知経路の自己診断（selftest_failure=true）によるテスト失敗です（リポジトリ・本番ともに変更していません）。"
          elif [ "${{ steps.fetch_sync.outcome }}" = "failure" ]; then
            stage_msg="上流取得または事前検証（sync_ito_portal.py）で異常を検出したため中断しました（リポジトリ・本番ともに一切上書きしていません）。"
          elif [ "${{ steps.push.outcome }}" = "failure" ]; then
            stage_msg="GitHub リポジトリへの commit/push 段階で失敗しました（本番は更新されていません）。"
          elif [ "${{ steps.verify_prod.outcome }}" = "failure" ]; then
            stage_msg="本番 URL ($PROD_URL) の配信物 sha256 とリポジトリ HEAD (${{ steps.push.outputs.sha }}) の不一致が解消されませんでした。Cloudflare Pages のデプロイ状態を確認してください。"
          else
            stage_msg="ワークフロー実行中にエラーが発生しました。"
          fi
          body="伊藤さんポータル自動同期が失敗しました。"$'\n'"状態: $stage_msg"$'\n\n'"Run: $url"
          gh label create auto-sync-failure --color B60205 --description "Ito portal auto-sync failure" 2>/dev/null || true
          n=$(gh issue list --label auto-sync-failure --state open --json number --jq '.[0].number' || true)
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --title "🔴 伊藤さんポータル自動同期 失敗" --label auto-sync-failure --assignee osaken55 --body "$body" \
              || gh issue create --title "🔴 伊藤さんポータル自動同期 失敗" --label auto-sync-failure --body "$body"
          fi

      - name: Close failure Issue on recovery
        if: success() && steps.verify_prod.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label auto-sync-failure --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "本番 URL 全ファイルの sha256 一致を確認し復旧しました: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done
