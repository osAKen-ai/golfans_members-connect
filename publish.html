<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>伊藤さんの更新ページ | Golfans</title>
  <link rel="stylesheet" href="publish.css">
  <script src="publish.js" defer></script>
</head>
<body>
  <main class="publish-card">
    <p class="brand">GOLFANS <span>MEMBERS’ CONNECT</span></p>
    <div class="symbol" aria-hidden="true">↗</div>
    <p class="eyebrow">伊藤さんの更新ページ</p>
    <h1>できたら、<br>ここから反映。</h1>
    <p class="description">デモサイトの最新の内容を<br class="mobile-break">公開サイトへ反映します。</p>
    <button id="publishButton" type="button" disabled><span aria-hidden="true">↗</span> 最新の内容を反映する</button>
    <section class="status" aria-live="polite" aria-atomic="true" aria-busy="true">
      <span id="statusDot" class="dot" aria-hidden="true"></span>
      <div><h2 id="statusTitle">接続を確認しています</h2><p id="statusDetail">少しお待ちください。</p></div>
    </section>
    <button id="checkButton" class="secondary" type="button" hidden>状況を確認する</button>
    <a class="site-link" href="/" target="_blank" rel="noopener noreferrer">公開サイトを見る <span aria-hidden="true">↗</span></a>
    <p class="footnote">自動更新を待たずに、好きなタイミングで。<br>反映が確認できるまで、この画面で状況を確認できます。</p>
  </main>
</body>
</html>
